<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexCompra ERP Enterprise v5.2.2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f8fb}#nxapp{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="nxapp" src="app.html?v=522"></iframe><script>(()=>{const rootFrame=document.getElementById('nxapp');const targetRx=/(Compras\s*\/\s*Cotação|Cotação|Ordem\s+de\s+Compra\s+XML|Central\s+Unificada)/i;const css=`
/* NexCompra 5.2.2 - módulos integrados em largura total */
.nx-integrated-module{width:100%!important;max-width:none!important;min-width:0!important;box-sizing:border-box!important;display:block!important;overflow:visible!important}
.nx-integrated-module>.card,.nx-integrated-module>.content,.nx-integrated-module>.container,.nx-integrated-module>.wrap,.nx-integrated-module>.module-content,.nx-integrated-module>form{width:100%!important;max-width:none!important;min-width:0!important;box-sizing:border-box!important}

.nx-integrated-module form{width:100%!important;max-width:none!important;min-width:0!important}
.nx-integrated-module .grid,.nx-integrated-module .form-grid,.nx-integrated-module .fields-grid,.nx-integrated-module .grid-2{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;width:100%!important;max-width:none!important}
.nx-integrated-module .grid-3{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important;width:100%!important;max-width:none!important}
.nx-integrated-module .grid-4{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:10px!important;width:100%!important;max-width:none!important}
.nx-integrated-module .field,.nx-integrated-module .form-group,.nx-integrated-module .input-group{min-width:0!important;max-width:none!important;width:100%!important}
.nx-integrated-module input:not([type=checkbox]):not([type=radio]),.nx-integrated-module select,.nx-integrated-module textarea{width:100%!important;max-width:none!important;min-width:0!important;box-sizing:border-box!important}
.nx-integrated-module .table-wrap,.nx-integrated-module .table-container,.nx-integrated-module .responsive-table{width:100%!important;max-width:none!important;overflow-x:auto!important;box-sizing:border-box!important}
.nx-integrated-module table{width:100%!important;max-width:none!important;table-layout:auto!important}
.nx-integrated-module iframe{width:100%!important;max-width:none!important;min-width:0!important;min-height:70vh!important;border:0!important;display:block!important}
.nx-integrated-module .card{max-width:none!important;width:100%!important;box-sizing:border-box!important}
.nx-integrated-module [class*=col-]{min-width:0!important;max-width:none!important}
/* evita painéis antigos presos em 400/500/600px */
.nx-integrated-module [style*="max-width"]{max-width:none!important}
.nx-integrated-module [style*="width: 400"],.nx-integrated-module [style*="width:400"],.nx-integrated-module [style*="width: 500"],.nx-integrated-module [style*="width:500"],.nx-integrated-module [style*="width: 600"],.nx-integrated-module [style*="width:600"]{width:100%!important}
@media(max-width:1100px){.nx-integrated-module .grid-3,.nx-integrated-module .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media(max-width:760px){.nx-integrated-module .grid,.nx-integrated-module .grid-2,.nx-integrated-module .grid-3,.nx-integrated-module .grid-4,.nx-integrated-module .form-grid,.nx-integrated-module .fields-grid{grid-template-columns:1fr!important}.nx-integrated-module{overflow-x:hidden!important}}
`;
const frameCss=`html,body,#app,#root,main,.container,.content,.wrap,.page,.page-content,.module,.module-content,.workspace{width:100%!important;max-width:none!important;min-width:0!important;box-sizing:border-box!important}body{margin:0!important;padding:12px!important;overflow-x:hidden!important}form{width:100%!important;max-width:none!important}.container,.content,.wrap,.page-content,.module-content,.workspace{margin-left:0!important;margin-right:0!important}.grid,.form-grid,.fields-grid,.grid-2{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.grid-3{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important}.field,.form-group,.input-group{min-width:0!important;width:100%!important}input:not([type=checkbox]):not([type=radio]),select,textarea{max-width:none!important;box-sizing:border-box!important}.table-wrap,.table-container,.responsive-table{width:100%!important;max-width:none!important;overflow-x:auto!important}table{width:100%!important;max-width:none!important;table-layout:auto!important}.card{max-width:none!important;box-sizing:border-box!important}@media(max-width:850px){.grid,.grid-2,.grid-3,.form-grid,.fields-grid{grid-template-columns:1fr!important}}`;
function addStyle(doc,id,text){if(!doc||!doc.head||doc.getElementById(id))return;const s=doc.createElement('style');s.id=id;s.textContent=text;doc.head.appendChild(s)}
function markTargets(doc){if(!doc||!doc.body)return;addStyle(doc,'nx522-integrated-css',css);const candidates=[...doc.querySelectorAll('section,.panel,[role=tabpanel],.module,.module-panel,.page,.page-content,.content,main>div')];for(const el of candidates){const txt=(el.innerText||'').slice(0,1200);if(targetRx.test(txt)){el.classList.add('nx-integrated-module');let p=el.parentElement;for(let i=0;i<2&&p;i++,p=p.parentElement){if(p.matches('.panel,.content,.page-content,.module-content,[role=tabpanel]'))p.classList.add('nx-integrated-module')}}}
for(const fr of doc.querySelectorAll('iframe')){try{fr.style.width='100%';fr.style.maxWidth='none';fr.style.minHeight='70vh';const fd=fr.contentDocument;if(fd){addStyle(fd,'nx522-frame-css',frameCss);if(targetRx.test((fd.body?.innerText||'').slice(0,1500))){fd.documentElement.classList.add('nx-integrated-frame')}}}catch(e){}fr.addEventListener('load',()=>{try{const fd=fr.contentDocument;addStyle(fd,'nx522-frame-css',frameCss)}catch(e){}})}}
function apply(){try{const d=rootFrame.contentDocument;if(!d)return;markTargets(d);const all=[...d.querySelectorAll('*')];for(const el of all){if(el.children.length)continue;const tx=(el.textContent||'').trim();if(/NexCompra ERP Enterprise (?:4\.1|5\.1\.0|5\.2\.0|5\.2\.1)/.test(tx))el.textContent='NexCompra ERP Enterprise 5.2.2'} }catch(e){console.warn('NX522',e)}}
rootFrame.addEventListener('load',()=>{setTimeout(apply,400);setTimeout(apply,1600);setTimeout(apply,4000)});setInterval(apply,3500)})();</script></body></html>
