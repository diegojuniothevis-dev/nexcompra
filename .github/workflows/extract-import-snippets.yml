name: Extract import snippets
on:
  push:
    branches: [fix-import-replace]
    paths:
      - '.github/workflows/extract-import-snippets.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract relevant snippets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.html')
          s=p.read_text(encoding='utf-8', errors='replace')
          terms=['Notas repetidas','duplicad','importa','planilha','Processar dados colados','fornecedor','chave NF-e','chave nfe','NF']
          out=[]
          for term in terms:
              out.append(f'\n===== TERM: {term} =====\n')
              for m in list(re.finditer(re.escape(term), s, re.I))[:50]:
                  a=max(0,m.start()-1800); b=min(len(s),m.end()+2800)
                  out.append(s[a:b])
                  out.append('\n---\n')
          Path('import-snippets.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit snippets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add import-snippets.txt
          git commit -m 'chore: extract import logic snippets' || exit 0
          git push
