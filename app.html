(1),15000,'Vínculo da empresa não carregado.');if(q.error)throw q.error;const m=q.data&&q.data[0];if(!m||!m.company_id)throw Error('Usuário sem empresa ativa vinculada.');try{w.localStorage.setItem('nexcompra_v50_company',m.company_id);w.localStorage.setItem('nex.activeClientId',m.company_id);w.sessionStorage.setItem('nex.session.client',m.company_id);w.localStorage.setItem('nexcompra_sql_role',m.role||'');if(m.company)w.localStorage.setItem('nexcompra_sql_company',JSON.stringify(m.company))}catch(_){}return m}function enterERP(w,d){try{const login=d.getElementById('nxLoginOverlay');if(login)login.style.display='none';const shell=d.querySelector('.shell');if(shell)shell.style.display='grid';if(typeof w.showApp==='function'){w.showApp();return true}if(typeof w.enterApp==='function'){w.enterApp();return true}if(typeof w.openApp==='function'){w.openApp();return true}const candidates=['nxLogin','loginOverlay','authOverlay','loginScreen'];for(const id of candidates){const el=d.getElementById(id);if(el)el.style.display='none'}return true}catch(e){console.warn('enterERP',e);return false}}function patchLogin(){try{const d=F.contentDocument,w=F.contentWindow,form=d&&d.getElementById('nxLoginForm');if(!form||form.dataset.nxSafeLogin==='941')return;form.dataset.nxSafeLogin='941';form.onsubmit=async function(e){e.preventDefault();const email=d.getElementById('nxLoginUser').value.trim().toLowerCase(),password=d.getElementById('nxLoginPass').value,msg=d.getElementById('nxLoginMsg'),btn=form.querySelector('button[type="submit"]'),sb=w.nxSupabase;if(!email||!password){msg.style.color='#b42318';msg.textContent='Informe o e-mail e a senha.';return}if(!sb){msg.style.color='#b42318';msg.textContent='Autenticação ainda carregando. Aguarde alguns segundos.';return}if(btn&&btn.disabled)return;if(btn){btn.disabled=true;btn.dataset.nxLabel=btn.textContent;btn.textContent='Entrando...'}msg.style.color='#526b82';msg.textContent='Autenticando no Supabase...';try{const r=await withTimeout(sb.auth.signInWithPassword({email,password}),30000,'A autenticação demorou mais que o esperado.');if(r.error)throw r.error;if(!r.data?.session||!r.data?.user)throw Error('Sessão não retornada pelo servidor.');msg.style.color='#1a7f48';msg.textContent='Acesso confirmado. Identificando empresa...';const membership=await resolveCompany(w,sb,r.data.user);msg.textContent='Empresa '+(membership.company?.trade_name||membership.company?.name||'NexCompra')+' carregada. Abrindo sistema...';injectSQL();let opened=false;try{if(typeof w.loadAccount==='function'){await Promise.race([Promise.resolve(w.loadAccount(r.data.user)),new Promise(res=>setTimeout(res,2500))]);opened=true}}catch(ex){console.warn('loadAccount legado ignorado',ex)}setTimeout(()=>{enterERP(w,d);injectSQL()},50);setTimeout(()=>{enterERP(w,d);injectSQL()},500);setTimeout(()=>{enterERP(w,d);injectSQL()},1500)}catch(err){console.error('NexCompra V9.4.1 login',err);msg.style.color='#b42318';const m=String(err?.message||'');msg.textContent=/invalid.*credentials/i.test(m)?'Usuário ou senha inválidos.':m||'Não foi possível entrar.'}finally{if(btn){btn.disabled=false;btn.textContent=btn.dataset.nxLabel||'Entrar no NexCompra'}}}}catch(e){console.warn('login patch',e)}}function enhance(){try{const d=F.contentDocument;if(!d||!d.head)return;patchLogin();injectSQL();if(!d.getElementById('nx-v941')){const s=d.createElement('style');s.id='nx-v941';s.textContent=':root{--top:64px!important;--modules:56px!important}.shell{grid-template-rows:var(--top) var(--modules) minmax(0,1fr)!important}.topbar{height:var(--top)!important;min-height:var(--top)!important}.sidebar{height:var(--modules)!important;padding:7px 12px!important;overflow-x:auto!important;overflow-y:hidden!important;scrollbar-width:none!important}.sidebar::-webkit-scrollbar{display:none!important}.nav-list{gap:6px!important;width:max-content!important;min-width:100%!important}.nav-item{flex:0 0 auto!important;min-height:38px!important;padding:7px 12px!important;border-radius:10px!important}@media(min-width:1280px){.nav-list{justify-content:center!important}}';d.head.appendChild(s)}}catch(e){console.warn('NexCompra V9.4.1',e)}}F.addEventListener('load',()=>{hide();enhance();setTimeout(enhance,300);setTimeout(enhance,1000);setTimeout(enhance,3000)});start();setTimeout(hide,20000)})();</script></body></html>
