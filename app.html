      const js=`<script id="nx-unified-behavior">(()=>{const q=(s,r=document)=>r.querySelector(s),qa=(s,r=document)=>[...r.querySelectorAll(s)];let lastActive=null;const resetHorizontal=()=>{document.documentElement.scrollLeft=0;document.body.scrollLeft=0;window.scrollTo({left:0,top:window.scrollY,behavior:'auto'})};const alignMenu=()=>{const nav=q('nav.tabs'),active=q('nav.tabs .tab.active');if(!nav||!active)return;const top=active.offsetTop-nav.offsetTop-(nav.clientHeight-active.offsetHeight)/2;nav.scrollTo({top:Math.max(0,top),left:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})};function animateModule(){const active=qa('main.wrap > .panel > .section,main.wrap > .panel > .view,main.wrap > .panel > [data-section],main.wrap > .panel > .tab-content').find(el=>{const s=getComputedStyle(el);return s.display!=='none'&&s.visibility!=='hidden'&&el.offsetParent!==null});if(active&&active!==lastActive){lastActive=active;active.classList.remove('nx-enter');requestAnimationFrame(()=>active.classList.add('nx-enter'))}resetHorizontal();alignMenu()}function init(){const body=document.body,oldTools=q('#nxUxTools');if(oldTools)oldTools.remove();body.classList.remove('nx-compact','nx-nav-collapsed');localStorage.removeItem('nexcompra_ui_nav');localStorage.removeItem('nexcompra_ui_density');qa('.tab').forEach(tab=>{if(tab.dataset.nxReady)return;tab.dataset.nxReady='1';tab.addEventListener('click',()=>requestAnimationFrame(()=>requestAnimationFrame(animateModule))) });animateModule()}document.addEventListener('DOMContentLoaded',init);setTimeout(init,100);setTimeout(init,800);new MutationObserver(()=>{clearTimeout(window.__nxUiTimer);window.__nxUiTimer=setTimeout(init,45)}).observe(document.documentElement,{childList:true,subtree:true});})();<\/script>`;
