const panel=d.createElement('section');panel.className='nx-users-module';panel.id='nxUsersModule';panel.innerHTML=`<div class="nx-u-wrap"><div class="nx-u-head"><div class="nx-u-title"><h2>Usuários e colaboradores</h2><p>Cadastre pessoas, defina perfis de acesso e gerencie quem pode entrar no NexCompra.</p></div><button class="nx-u-btn nx-u-muted" id="nxURefresh">↻ Atualizar</button></div><div class="nx-u-lock" id="nxULock"></div><div class="nx-u-grid"><div class="nx-u-card"><h3 id="nxUFormTitle">Novo colaborador</h3><form id="nxUForm"><input type="hidden" id="nxUId"><div class="nx-u-field"><label>Nome completo</label><input id="nxUName" required placeholder="Nome do colaborador"></div><div class="nx-u-field"><label>E-mail de acesso</label><input id="nxUEmail" type="email" required placeholder="usuario@empresa.com"></div><div class="nx-u-field"><label>Perfil / permissão</label><select id="nxURole"><option>Administrador</option><option>Gerente</option><option>Comprador</option><option>Financeiro</option><option>Fiscal</option><option selected>Consulta</option></select></div><div class="nx-u-field"><label>Senha <span style="font-weight:400">(mín. 6 caracteres)</span></label><input id="nxUPass" type="password" placeholder="Obrigatória no novo usuário"></div><div style="display:flex;gap:8px"><button class="nx-u-btn nx-u-primary" type="submit" id="nxUSave">Salvar usuário</button><button class="nx-u-btn nx-u-muted" type="button" id="nxUCancel" style="display:none">Cancelar</button></div><div class="nx-u-msg" id="nxUMsg"></div></form></div><div class="nx-u-card"><h3>Colaboradores da empresa</h3><div style="overflow:auto;max-height:62vh"><table class="nx-u-table"><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead><tbody id="nxUTbody"></tbody></table></div></div></div></div>`;workspace.appendChild(panel);
const $=s=>panel.querySelector(s), URL='https://ulgocbftudqnntpupwkl.supabase.co/functions/v1/admin-users', KEY='sb_publishable_Z4z1U8uqRzHyY1Cv9G3X4Q_5zaw_un-';let users=[];
async function invoke(action,payload={}){const sb=w.nxSupabase;if(!sb)throw new Error('Supabase ainda não foi inicializado.');const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Sessão expirada. Entre novamente.');const companyId=localStorage.getItem('nex.activeClientId')||sessionStorage.getItem('nex.session.client');if(!companyId)throw new Error('Empresa atual não identificada.');const r=await fetch(URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,company_id:companyId,...payload})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Erro HTTP '+r.status));return j}
function reset(){ $('#nxUId').value='';$('#nxUName').value='';$('#nxUEmail').value='';$('#nxURole').value='Consulta';$('#nxUPass').value='';$('#nxUFormTitle').textContent='Novo colaborador';$('#nxUCancel').style.display='none';$('#nxUMsg').textContent=''}
function render(){const tb=$('#nxUTbody');tb.innerHTML='';if(!users.length){tb.innerHTML='<tr><td colspan="5" class="nx-u-empty">Nenhum colaborador encontrado.</td></tr>';return}users.forEach(u=>{const tr=d.createElement('tr');tr.innerHTML=`<td><b>${esc(u.nome)}</b></td><td>${esc(u.email)}</td><td><span class="nx-u-badge">${esc(u.perfil)}</span></td><td>${u.ativo?'<span class="nx-u-badge" style="background:#e9f7ee;color:#247a46">Ativo</span>':'<span class="nx-u-badge" style="background:#fdebec;color:#a6323a">Inativo</span>'}</td><td><div class="nx-u-actions"><button class="nx-u-btn nx-u-muted" data-edit="${u.id}">Editar</button><button class="nx-u-btn ${u.ativo?'nx-u-danger':'nx-u-ok'}" data-toggle="${u.id}" data-active="${u.ativo?'0':'1'}">${u.ativo?'Desativar':'Ativar'}</button></div></td>`;tb.appendChild(tr)})}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){const msg=$('#nxUMsg');msg.textContent='Carregando...';try{const r=await invoke('list');users=r.users||[];render();$('#nxULock').style.display='none';$('#nxUForm').style.display='block';msg.textContent=''}catch(e){users=[];render();$('#nxULock').textContent=e.message;$('#nxULock').style.display='block';$('#nxUForm').style.display='none';msg.textContent=''}}

$('#nxURefresh').onclick=load;$('#nxUCancel').onclick=reset;$('#nxUForm').onsubmit=async e=>{e.preventDefault();const id=$('#nxUId').value,nome=$('#nxUName').value.trim(),email=$('#nxUEmail').value.trim(),perfil=$('#nxURole').value,senha=$('#nxUPass').value,msg=$('#nxUMsg');msg.textContent='Salvando...';try{if(id)await invoke('update',{user_id:id,nome,email,perfil,senha});else await invoke('create',{nome,email,perfil,senha});msg.style.color='#247a46';msg.textContent=id?'Usuário atualizado.':'Colaborador criado com sucesso.';reset();await load()}catch(x){msg.style.color='#b33b3b';msg.textContent=x.message}};
