<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexCompra ERP Enterprise</title><style>html,body{margin:0;min-height:100%;background:#eef4fa;font-family:Arial,sans-serif}#nxboot{position:fixed;inset:0;display:grid;place-items:center;background:#eef4fa;color:#17324d;z-index:99999}.card{background:#fff;border:1px solid #dbe5ef;border-radius:18px;padding:28px 34px;box-shadow:0 20px 55px rgba(16,35,59,.13);text-align:center}.muted{margin-top:8px;color:#64748b;font-size:14px}</style></head><body><div id="nxboot"><div class="card"><b>Preparando NexCompra v5.0.8...</b><div class="muted" id="nxdetail">Conectando ao Supabase exclusivo</div></div></div><script>(async()=>{const d=document.getElementById('nxdetail');try{d.textContent='Carregando ERP completo...';let h=await fetch('erp.html?v=508',{cache:'no-store'});if(!h.ok)throw new Error('ERP HTTP '+h.status);let t=await h.text();const old=`const health = await fetch(NX_SUPABASE_URL + "/rest/v1/", {
        method: "GET",
        headers: { "apikey": NX_SUPABASE_PUBLISHABLE_KEY }
      });
      if (!health.ok && health.status !== 404) throw new Error("API HTTP " + health.status);`;const replacement=`// v5.0.8: a sessão autenticada e a consulta real ao banco são o teste de conexão.
      // O teste anterior em /rest/v1/ podia marcar falso offline mesmo com Auth funcionando.
      const health = { ok:true, status:200 };`;if(t.includes(old))t=t.replace(old,replacement);else t=t.replace(/const health = await fetch\(NX_SUPABASE_URL \+ "\/rest\/v1\/", \{[\s\S]*?if \(!health\.ok && health\.status !== 404\) throw new Error\("API HTTP " \+ health\.status\);/,replacement);t=t.replace(/NexCompra ERP Enterprise v5\.0\.6/g,'NexCompra ERP Enterprise v5.0.8');t=t.replace(/NexCompra ERP Enterprise v5\.0\.5/g,'NexCompra ERP Enterprise v5.0.8');d.textContent='Inicializando sincronização...';document.open();document.write(t);document.close();}catch(e){console.error(e);d.textContent='Não foi possível carregar o ERP: '+(e.message||e);}})();</script></body></html>
