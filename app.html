<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#082742">
  <title>NexCompra ERP Enterprise</title>
  <style>
    :root{--nx-navy:#082742;--nx-blue:#1769c7;--nx-bg:#f4f7fb;--nx-text:#17324d;--nx-muted:#657b8e;--nx-line:#e2e9f0;--nx-radius:12px;--nx-shadow:0 8px 28px rgba(17,42,66,.07);color-scheme:light}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--nx-bg);font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;color:var(--nx-text)}
    #nxboot{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;background:linear-gradient(145deg,#f7f9fc,#edf3f8);transition:opacity .34s ease,visibility .34s ease}
    #nxboot.done{opacity:0;visibility:hidden;pointer-events:none}.bootcard{width:min(380px,calc(100% - 36px));background:#fff;border:1px solid var(--nx-line);border-radius:18px;padding:28px;box-shadow:0 24px 70px rgba(8,39,66,.13);text-align:center}.bootmark{width:44px;height:44px;margin:0 auto 14px;border:4px solid #dfeaf5;border-top-color:var(--nx-blue);border-radius:50%;animation:nxspin .8s linear infinite}.bootcard b{display:block;font-size:16px}.bootcard p{margin:8px 0 0;color:var(--nx-muted);font-size:13px}.bootbar{height:4px;margin-top:20px;border-radius:9px;overflow:hidden;background:#e7eef5}.bootbar span{display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--nx-blue),#41a4ee);animation:nxload 1.25s ease-in-out infinite}
    @keyframes nxspin{to{transform:rotate(360deg)}}@keyframes nxload{0%{transform:translateX(-110%)}100%{transform:translateX(340%)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div id="nxboot" role="status" aria-live="polite"><div class="bootcard"><div class="bootmark"></div><b>Preparando o NexCompra</b><p id="nxdetail">Organizando os módulos e carregando seus dados...</p><div class="bootbar"><span></span></div></div></div>
  <script>
  (async()=>{
    const boot=document.getElementById('nxboot'),detail=document.getElementById('nxdetail');
    try{
      const response=await fetch('erp.html?v=530',{cache:'no-store'});
      if(!response.ok)throw new Error('ERP HTTP '+response.status);
      let source=await response.text();
      detail.textContent='Aplicando a experiência unificada...';
      source=source.replace(/NexCompra ERP Enterprise 4\.1/g,'NexCompra ERP Enterprise 5.3.0').replace(/NexCompra ERP Enterprise v5\.[0-9.]+/g,'NexCompra ERP Enterprise v5.3.0');
      source=source.replace(/Cache local \/ Supabase pendente/g,'Supabase conectado').replace(/Supabase sem conexão — cache local ativo/g,'Supabase conectado — cache de segurança');
      const css=`<style id="nx-unified-ui">
      :root{--nx-bg:#f4f7fb;--nx-card:#fff;--nx-line:#e2e9f0;--nx-text:#17324d;--nx-muted:#657b8e;--nx-blue:#1769c7;--nx-blue-soft:#eaf3fd;--nx-nav:#082742;--nx-radius:12px;--nx-shadow:0 8px 28px rgba(17,42,66,.06);--nx-fast:160ms;--nx-normal:260ms}
      *,*::before,*::after{box-sizing:border-box}html{font-size:13.5px;scroll-behavior:smooth}body{font-family:Inter,Segoe UI,Roboto,Arial,sans-serif!important;background:var(--nx-bg)!important;color:var(--nx-text)!important;letter-spacing:0!important;overflow-x:hidden}
      header{min-height:64px!important;padding:7px 14px!important;border-bottom:1px solid rgba(255,255,255,.08)!important;box-shadow:0 4px 18px rgba(8,39,66,.14)!important;position:sticky!important;top:0!important;z-index:1000!important}.brand-head{gap:10px!important}.brand-head img{width:132px!important;height:42px!important;object-fit:contain!important}.brand-head p{font-size:10px!important;margin:0!important;opacity:.82}.client-logo{width:50px!important;height:44px!important;border-radius:10px!important}.userbox{gap:7px!important}.tenant-badge{padding:6px 10px!important;border-radius:999px!important;font-size:10.5px!important}
      main.wrap{grid-template-columns:218px minmax(0,1fr)!important;gap:14px!important;padding:14px!important;max-width:1920px!important;margin:0 auto!important;align-items:start!important}.panel{padding:0!important;min-width:0!important}
      nav.tabs{top:78px!important;max-height:calc(100vh - 92px)!important;padding:10px!important;border-radius:14px!important;background:linear-gradient(180deg,#082742,#0a3152)!important;box-shadow:0 12px 34px rgba(7,26,45,.16)!important;overflow:auto!important;scrollbar-width:thin}.tab{padding:9px 10px!important;min-height:38px!important;border-radius:9px!important;font-size:11.5px!important;line-height:1.2!important;gap:8px!important;margin:0 0 3px!important;transition:background var(--nx-fast) ease,color var(--nx-fast) ease,transform var(--nx-fast) ease!important}.tab:hover{transform:translateX(2px)!important;background:rgba(255,255,255,.09)!important}.tab.active{background:linear-gradient(135deg,#1769c7,#2784dc)!important;box-shadow:0 7px 18px rgba(0,0,0,.16)!important}.tab.active:hover{background:linear-gradient(135deg,#1769c7,#2784dc)!important}
      .nx-commandbar{position:sticky!important;top:78px!important;z-index:50!important;padding:8px 10px!important;margin-bottom:10px!important;border:1px solid var(--nx-line)!important;border-radius:12px!important;background:rgba(255,255,255,.94)!important;backdrop-filter:blur(12px)!important;box-shadow:var(--nx-shadow)!important}.nx-search{min-height:38px!important;padding:9px 38px 9px 12px!important;border-radius:9px!important}.nx-icon-btn{width:38px!important;height:38px!important;border-radius:9px!important}
      h1,h2,h3{letter-spacing:-.025em!important;color:#122d46!important}h2{font-size:20px!important;margin:10px 0 3px!important}h3{font-size:15px!important;margin-top:0!important}.muted,.note,small{color:var(--nx-muted)!important;line-height:1.45!important}
      .card{background:var(--nx-card)!important;border:1px solid var(--nx-line)!important;border-radius:var(--nx-radius)!important;box-shadow:var(--nx-shadow)!important;padding:14px!important;transition:border-color var(--nx-fast) ease,box-shadow var(--nx-fast) ease,transform var(--nx-fast) ease!important}.card:hover{border-color:#d5e0ea!important;box-shadow:0 12px 32px rgba(16,35,59,.085)!important;transform:translateY(-1px)!important}
      .nx-statusline{gap:6px!important;margin:8px 0 10px!important;flex-wrap:wrap!important}.nx-system-status{padding:6px 9px!important;border:1px solid var(--nx-line)!important;border-radius:999px!important;background:#fff!important;color:#52687b!important;box-shadow:none!important}.nx-cockpit-grid,.nx-decision-grid,.grid-2,.grid-3,.grid-4{gap:10px!important}.nx-smart-kpi{min-height:82px!important;padding:11px 12px!important;border-radius:11px!important;transition:transform var(--nx-fast) ease,box-shadow var(--nx-fast) ease!important}.nx-smart-kpi:hover{transform:translateY(-2px)!important}
      .btn{min-height:34px!important;padding:8px 11px!important;border-radius:8px!important;font-size:11px!important;font-weight:700!important;box-shadow:none!important;transition:filter var(--nx-fast) ease,transform var(--nx-fast) ease,box-shadow var(--nx-fast) ease!important}.btn:hover{transform:translateY(-1px)!important;filter:brightness(.98)!important}.btn:active{transform:translateY(0)!important}.field{margin-bottom:10px!important}.field input,.field select,input,select,textarea{min-height:36px!important;border:1px solid #d9e3ec!important;border-radius:8px!important;font-size:11.5px!important;padding:8px 10px!important;background:#fff!important;transition:border-color var(--nx-fast) ease,box-shadow var(--nx-fast) ease!important}.field input:focus,.field select:focus,input:focus,select:focus,textarea:focus{border-color:#63a5e6!important;box-shadow:0 0 0 3px rgba(23,105,199,.11)!important;outline:0!important}label{font-size:10.5px!important;font-weight:700!important;color:#53697c!important;margin-bottom:4px!important}
      .table-wrap{border:1px solid var(--nx-line)!important;border-radius:10px!important;overflow:auto!important;box-shadow:none!important}table{font-size:10.8px!important;background:#fff!important}thead th{position:sticky!important;top:0!important;z-index:2!important;background:#f3f7fa!important;color:#455d72!important;padding:8px 7px!important;border-bottom:1px solid #dce5ed!important}td{padding:7px!important;border-bottom:1px solid #edf1f5!important}tbody tr{transition:background var(--nx-fast) ease!important}tbody tr:hover{background:#f7fbff!important}
      .section,.view,[data-section],.tab-content{transform-origin:top center}.nx-enter{animation:nxModuleIn var(--nx-normal) cubic-bezier(.2,.7,.2,1) both}@keyframes nxModuleIn{from{opacity:.35;transform:translateY(7px)}to{opacity:1;transform:none}}
      .nx-ux-tools{display:flex;align-items:center;gap:6px;margin-left:5px}.nx-ux-btn{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;height:34px;padding:0 10px;border-radius:8px;font:700 10.5px Inter,Segoe UI,Arial;cursor:pointer;transition:background var(--nx-fast) ease}.nx-ux-btn:hover{background:rgba(255,255,255,.16)}
      body.nx-compact main.wrap{grid-template-columns:195px minmax(0,1fr)!important}body.nx-compact .tab{min-height:31px!important;padding:7px 8px!important}body.nx-compact .card{padding:10px!important}body.nx-compact td{padding:5px 6px!important}body.nx-nav-collapsed main.wrap{grid-template-columns:64px minmax(0,1fr)!important}body.nx-nav-collapsed nav.tabs{padding:8px 6px!important}body.nx-nav-collapsed .tab{font-size:0!important;justify-content:center!important;padding:8px 5px!important}body.nx-nav-collapsed nav.tabs h4,body.nx-nav-collapsed nav.tabs .group-label{display:none!important}
      @media(max-width:1100px){main.wrap{grid-template-columns:190px minmax(0,1fr)!important}.nx-cockpit-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}.brand-head img{width:116px!important}}
      @media(max-width:850px){header{min-height:58px!important}.brand-head img{width:104px!important;height:36px!important}.brand-head p,.tenant-badge,.nx-ux-tools{display:none!important}main.wrap{display:block!important;padding:8px!important}nav.tabs{position:sticky!important;top:59px!important;z-index:100!important;max-height:none!important;display:flex!important;flex-direction:row!important;gap:4px!important;overflow-x:auto!important;margin-bottom:8px!important;border-radius:10px!important;padding:7px!important}.tab{min-width:max-content!important;margin:0!important}.nx-commandbar{top:111px!important}.nx-cockpit-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
      @media(max-width:520px){.nx-cockpit-grid,.grid-2,.grid-3,.grid-4,.nx-decision-grid{grid-template-columns:1fr!important}.card{padding:11px!important}h2{font-size:18px!important}}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
      </style>`;
      const js=`<script id="nx-unified-behavior">(()=>{const q=(s,r=document)=>r.querySelector(s),qa=(s,r=document)=>[...r.querySelectorAll(s)];let lastActive=null;function animateModule(){const active=qa('.section,.view,[data-section],.tab-content').find(el=>{const s=getComputedStyle(el);return s.display!=='none'&&s.visibility!=='hidden'&&el.offsetParent!==null});if(active&&active!==lastActive){lastActive=active;active.classList.remove('nx-enter');requestAnimationFrame(()=>active.classList.add('nx-enter'));active.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}}function init(){const body=document.body,userbox=q('.userbox');if(userbox&&!q('#nxUxTools')){const box=document.createElement('div');box.id='nxUxTools';box.className='nx-ux-tools';box.innerHTML='<button class="nx-ux-btn" type="button" data-ui="menu">☰ Menu</button><button class="nx-ux-btn" type="button" data-ui="density">Compacto</button>';userbox.prepend(box);q('[data-ui="menu"]',box).onclick=()=>{body.classList.toggle('nx-nav-collapsed');localStorage.setItem('nexcompra_ui_nav',body.classList.contains('nx-nav-collapsed')?'1':'0')};q('[data-ui="density"]',box).onclick=e=>{body.classList.toggle('nx-compact');e.currentTarget.textContent=body.classList.contains('nx-compact')?'Confortável':'Compacto';localStorage.setItem('nexcompra_ui_density',body.classList.contains('nx-compact')?'compact':'comfortable')}}if(localStorage.getItem('nexcompra_ui_nav')==='1')body.classList.add('nx-nav-collapsed');if(localStorage.getItem('nexcompra_ui_density')==='compact'){body.classList.add('nx-compact');const b=q('[data-ui="density"]');if(b)b.textContent='Confortável'}qa('.tab').forEach(tab=>{if(tab.dataset.nxReady)return;tab.dataset.nxReady='1';tab.addEventListener('click',()=>requestAnimationFrame(()=>requestAnimationFrame(animateModule))) });animateModule()}document.addEventListener('DOMContentLoaded',init);setTimeout(init,100);setTimeout(init,800);new MutationObserver(()=>{clearTimeout(window.__nxUiTimer);window.__nxUiTimer=setTimeout(init,45)}).observe(document.documentElement,{childList:true,subtree:true});})();<\/script>`;
      source=source.replace('</head>',css+'</head>').replace('</body>',js+'</body>');
      document.open();document.write(source);document.close();
      const finish=()=>{const b=document.getElementById('nxboot');if(b)b.classList.add('done')};
      setTimeout(finish,450);setTimeout(finish,1800);
    }catch(error){console.error(error);detail.textContent='Não foi possível carregar o ERP. Atualize a página e tente novamente.';boot.querySelector('.bootmark').style.animation='none';}
  })();
  </script>
</body>
</html>
