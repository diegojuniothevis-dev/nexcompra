<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexCompra ERP Enterprise</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef4fa}#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:Arial,sans-serif;color:#17324d;background:#eef4fa;z-index:5}.box{background:white;border:1px solid #dbe5ef;border-radius:16px;padding:24px 28px;box-shadow:0 20px 50px rgba(16,35,59,.12);text-align:center}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><div id="loading"><div class="box"><b>Conectando o NexCompra ao Supabase...</b><div id="detail" style="margin-top:8px;color:#64748b;font-size:14px">Validando sessão e sincronizando dados</div></div></div><iframe id="erp" title="NexCompra ERP" hidden></iframe><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://ulgocbftudqnntpupwkl.supabase.co';
const KEY='sb_publishable_Z4z1U8uqRzHyY1Cv9G3X4Q_5zaw_un-';
const BASE='https://diegojuniothevis-dev.github.io/nexcompra/';
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const detail=document.getElementById('detail');
let companyId=null,userId=null,ready=false,timer=null;
function isCloudKey(k){k=String(k||'');const l=k.toLowerCase();if(!l.startsWith('nexcompra'))return false;if(l.includes('accounts')||l.includes('session')||l.includes('senha')||l.includes('password'))return false;if(l.includes('backup')||l.includes('ultimo_pacote')||l.includes('emergencia')||l.includes('teste_backup'))return false;return true}
function moduleFromKey(k){return 'localstorage:'+String(k).replace(/[^a-zA-Z0-9_.:-]/g,'_').slice(0,180)}
function safeParse(v){try{return JSON.parse(v)}catch(e){return {__nx_raw:String(v)}}}
function safeStringify(v){return v&&typeof v==='object'&&Object.prototype.hasOwnProperty.call(v,'__nx_raw')?String(v.__nx_raw):JSON.stringify(v)}
async function getCompany(){const {data:{user},error:ue}=await sb.auth.getUser();if(ue||!user)return null;userId=user.id;const {data,error}=await sb.from('nx_memberships').select('company_id,role,active').eq('user_id',user.id).eq('active',true).limit(1);if(error)throw error;if(!data?.length)return null;companyId=data[0].company_id;localStorage.setItem('nexcompra_v50_company',companyId);return companyId}
async function hydrate(){if(!await getCompany())throw new Error('Usuário sem empresa vinculada');const {data,error}=await sb.from('nx_app_state').select('module,payload').eq('company_id',companyId);if(error)throw error;(data||[]).forEach(r=>{if(r.module?.startsWith('localstorage:'))localStorage.setItem(r.module.slice(13),safeStringify(r.payload))});ready=true}
async function pushKey(k,v){if(!ready||!companyId||!userId||!isCloudKey(k))return;const {error}=await sb.from('nx_app_state').upsert({company_id:companyId,module:moduleFromKey(k),payload:safeParse(v),updated_by:userId,updated_at:new Date().toISOString()},{onConflict:'company_id,module'});if(error)throw error}
async function pushAll(){if(!ready)return;const jobs=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(isCloudKey(k))jobs.push(pushKey(k,localStorage.getItem(k)))}await Promise.all(jobs)}
function markConnected(){const f=document.getElementById('erp');try{const d=f.contentDocument;if(!d)return;const el=d.getElementById('saveState');if(el)el.textContent='🟢 Supabase conectado — salvamento em nuvem ativo';d.querySelectorAll('.nx-system-status').forEach(x=>{if((x.textContent||'').toLowerCase().includes('supabase')||(x.textContent||'').toLowerCase().includes('cache local')||(x.textContent||'').toLowerCase().includes('banco local'))x.innerHTML='<span class="nx-dot"></span> Supabase conectado'});}catch(e){}}
window.addEventListener('storage',e=>{if(e.storageArea===localStorage&&e.key&&isCloudKey(e.key)&&e.newValue!=null){clearTimeout(timer);timer=setTimeout(()=>pushKey(e.key,e.newValue).catch(console.error),250)}});
window.addEventListener('online',()=>pushAll().catch(console.error));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pushAll().catch(console.error)});
setInterval(()=>{pushAll().then(markConnected).catch(console.error)},15000);
(async()=>{try{const {data:{session}}=await sb.auth.getSession();if(!session){location.replace(BASE);return}detail.textContent='Baixando dados da empresa...';await hydrate();const f=document.getElementById('erp');f.onload=()=>{document.getElementById('loading').remove();f.hidden=false;setTimeout(markConnected,500);setTimeout(markConnected,2500);pushAll().catch(console.error)};f.src='erp.html?v=507';}catch(e){console.error(e);detail.textContent='Falha ao sincronizar: '+(e.message||e);setTimeout(()=>location.replace(BASE),3500)}})();
</script></body></html>
