<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NexCompra ERP Enterprise</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}#nxroot{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="nxroot" src="app.html?v=540" title="NexCompra ERP"></iframe><script>(()=>{const root=document.getElementById('nxroot');const quoteCss=`
:root{--sidebar-w:242px;--sidebar-mini:74px}
body{padding-left:var(--sidebar-w)!important;transition:padding-left .25s ease!important;overflow-x:hidden!important}
body.sidebar-collapsed{padding-left:var(--sidebar-mini)!important}
header{position:sticky!important;top:0!important;z-index:20!important}
header .wrap{padding:11px 22px!important}
.dualBrand{gap:13px!important}.systemBrand{padding-right:13px!important}.systemBrand img{width:112px!important;height:55px!important;border-radius:9px!important;padding:2px!important}.clientBrand img{width:124px!important;height:55px!important;border-radius:9px!important;padding:5px!important}.brandText h1{font-size:20px!important}.brandText .moduleName{font-size:12px!important}
.tableWrap{overscroll-behavior:contain!important;-webkit-overflow-scrolling:touch!important}.tableWrap th{position:sticky!important;top:0!important;z-index:2!important}
#tabItens{min-width:1450px!important;table-layout:auto!important}#tabItens .col-codigo{width:78px!important;min-width:78px!important;max-width:78px!important}#tabItens .col-descricao{width:34%!important;min-width:380px!important}#tabItens .col-unidade{width:76px!important;min-width:76px!important;max-width:76px!important}#tabItens .col-quantidade{width:90px!important;min-width:90px!important;max-width:90px!important}#tabItens td.col-codigo input{min-width:0!important;width:70px!important;text-align:center!important}#tabItens td.col-descricao textarea{width:100%!important;min-width:360px!important;min-height:48px!important;height:auto!important;line-height:1.3!important;padding:8px!important;resize:vertical!important;overflow-wrap:anywhere!important}#tabItens td.col-unidade select{min-width:68px!important;width:68px!important}#tabItens td.col-quantidade input{min-width:82px!important;width:82px!important}
.actionSidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);z-index:80;background:linear-gradient(180deg,#06155d 0%,#0a3d8f 100%);color:#fff;padding:14px 11px;box-shadow:8px 0 28px rgba(7,26,114,.18);transition:width .25s ease;overflow:hidden;display:flex;flex-direction:column}.sidebar-collapsed .actionSidebar{width:var(--sidebar-mini)}.sidebarHead{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px;padding:0 3px 12px;border-bottom:1px solid rgba(255,255,255,.18)}.sidebarTitle{font-size:12px;font-weight:900;letter-spacing:.9px;white-space:nowrap}.sidebarToggle{display:grid!important;place-items:center;flex:0 0 38px;width:38px;height:38px;padding:0!important;border-radius:10px!important;background:rgba(255,255,255,.14)!important;color:#fff!important;box-shadow:none!important;font-size:20px!important;border:0!important}.sidebarToggle:hover{background:rgba(255,255,255,.24)!important}.actionSidebar .actions{display:flex!important;flex-direction:column!important;flex-wrap:nowrap!important;gap:8px!important;margin-top:14px!important;overflow-y:auto!important;overflow-x:hidden!important;padding:0 1px 8px!important;scrollbar-width:thin}.actionSidebar .actions button{display:flex!important;align-items:center!important;gap:11px!important;width:100%!important;min-height:44px!important;padding:9px 11px!important;border-radius:11px!important;box-shadow:none!important;text-align:left!important;white-space:nowrap!important;background:rgba(255,255,255,.96)!important;color:#071a72!important;transition:transform .15s ease,background .15s ease!important}.actionSidebar .actions button:hover{transform:translateX(2px)!important;background:#fff!important}.actionSidebar .autoSaveStatus{width:100%!important;justify-content:center!important;white-space:normal!important;text-align:center!important;line-height:1.25!important;box-shadow:none!important}.sidebarStatus{margin-top:auto;padding-top:10px}.sidebar-collapsed .sidebarTitle,.sidebar-collapsed .actionLabel,.sidebar-collapsed .sidebarStatus{opacity:0;pointer-events:none}.sidebar-collapsed .sidebarToggle{transform:rotate(180deg)}.sidebarBackdrop{display:none}.mobileMenuButton{display:none;position:fixed;left:12px;bottom:14px;z-index:65;width:52px;height:52px;padding:0;place-items:center;border-radius:50%;background:#071a72;color:#fff;font-size:23px;box-shadow:0 8px 24px rgba(7,26,114,.35);border:0}
@media(max-width:900px){.dualBrand{flex-direction:column!important;align-items:flex-start!important}.systemBrand{border-right:0!important;padding-right:0!important}.systemBrand img{width:100px!important;height:49px!important}.clientBrand img{width:112px!important;height:49px!important}}
@media(max-width:850px){body,body.sidebar-collapsed{padding-left:0!important}.actionSidebar{width:min(280px,86vw)!important;transform:translateX(0);transition:transform .25s ease}.sidebar-collapsed .actionSidebar{width:min(280px,86vw)!important;transform:translateX(-100%)}.mobileMenuButton{display:grid!important}.sidebarBackdrop{display:block;position:fixed;inset:0;z-index:70;background:rgba(3,12,45,.5);opacity:1;transition:opacity .25s}.sidebar-collapsed .sidebarBackdrop{opacity:0;pointer-events:none}.sidebar-collapsed .sidebarTitle,.sidebar-collapsed .actionLabel,.sidebar-collapsed .sidebarStatus{opacity:1;pointer-events:auto}.sidebar-collapsed .sidebarToggle{transform:none}}
@media(max-width:700px){header{position:relative!important}.wrap,main{padding-left:12px!important;padding-right:12px!important}.card{padding:13px!important;border-radius:14px!important}.tabs{display:grid!important;grid-template-columns:1fr 1fr!important;position:sticky!important;top:0!important;z-index:10!important;background:#f3f7fb!important;padding:6px 0!important}.kpis{grid-template-columns:1fr 1fr!important}.kpi span{font-size:18px!important}input,select,textarea{font-size:16px!important}.tableWrap{max-height:68vh!important}#tabItens td.col-descricao textarea{min-width:250px!important}}
@media print{body{padding-left:0!important}.actionSidebar,.sidebarBackdrop,.mobileMenuButton{display:none!important}.systemBrand img,.clientBrand img{max-height:60px!important}.winnersSummary{overflow:visible!important}.winnersSummary table{min-width:0!important;font-size:10px!important}}
`;
function labelIcon(t){t=(t||'').toLowerCase();if(t.includes('nova'))return '＋';if(t.includes('fornecedor'))return '🏢';if(t.includes('item'))return '📦';if(t.includes('recalcular'))return '↻';if(t.includes('ordem'))return '🧾';if(t.includes('relat'))return '📊';if(t.includes('imprimir'))return '🖨';if(t.includes('backup'))return '💾';if(t.includes('restaur'))return '↥';return '•'}
function patchQuoteFrame(q){try{const d=q.contentDocument;if(!d||!d.head||!d.body)return;if(d.getElementById('nx-quote-v2-patch'))return;const st=d.createElement('style');st.id='nx-quote-v2-patch';st.textContent=quoteCss;d.head.appendChild(st);d.documentElement.dataset.nxQuoteUi='v2';const body=d.body;const topActions=d.querySelector('header .actions');if(topActions&&!d.querySelector('.actionSidebar')){const aside=d.createElement('aside');aside.className='actionSidebar noPrint';aside.setAttribute('aria-label','Ações da cotação');const head=d.createElement('div');head.className='sidebarHead';const title=d.createElement('span');title.className='sidebarTitle';title.textContent='AÇÕES RÁPIDAS';const toggle=d.createElement('button');toggle.type='button';toggle.className='sidebarToggle';toggle.title='Recolher menu';toggle.textContent='‹';head.append(title,toggle);const acts=d.createElement('div');acts.className='actions';[...topActions.querySelectorAll('button')].forEach(btn=>{const label=(btn.textContent||'').trim();const icon=labelIcon(label);btn.innerHTML='<span class="actionIcon">'+icon+'</span><span class="actionLabel"></span>';btn.querySelector('.actionLabel').textContent=label;acts.appendChild(btn)});aside.append(head,acts);const auto=d.querySelector('.autoSaveStatus');if(auto){const status=d.createElement('div');status.className='sidebarStatus';status.appendChild(auto);aside.appendChild(status)}body.prepend(aside);topActions.remove();const backdrop=d.createElement('div');backdrop.className='sidebarBackdrop noPrint';body.appendChild(backdrop);const mobile=d.createElement('button');mobile.type='button';mobile.className='mobileMenuButton noPrint';mobile.textContent='☰';mobile.title='Abrir ações';body.appendChild(mobile);const setCollapsed=v=>{body.classList.toggle('sidebar-collapsed',v);try{localStorage.setItem('nexcompra_quote_sidebar',v?'1':'0')}catch(e){}};toggle.addEventListener('click',()=>setCollapsed(!body.classList.contains('sidebar-collapsed')));backdrop.addEventListener('click',()=>setCollapsed(true));mobile.addEventListener('click',()=>setCollapsed(false));let saved=false;try{saved=localStorage.getItem('nexcompra_quote_sidebar')==='1'}catch(e){}setCollapsed(innerWidth<=850?true:saved)}d.querySelectorAll('button,input,select,textarea').forEach(el=>{if(!el.dataset.nxFocusReady){el.dataset.nxFocusReady='1'}})}catch(e){console.warn('Cotação v2 patch',e)}}
function scan(){try{const rd=root.contentDocument;if(!rd)return;const q=rd.getElementById('nxQuoteFrame');if(!q)return;if(!q.dataset.nxV2Listener){q.dataset.nxV2Listener='1';q.addEventListener('load',()=>setTimeout(()=>patchQuoteFrame(q),80))}patchQuoteFrame(q)}catch(e){}}
root.addEventListener('load',()=>{setTimeout(scan,300);setTimeout(scan,1200);setTimeout(scan,3000)});setInterval(scan,1200)})();</script></body></html>
