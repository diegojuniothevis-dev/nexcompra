<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexCompra ERP Enterprise</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f3f7fb;color:#10233b}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);background:#fff;border:1px solid #dbe5ef;border-radius:22px;box-shadow:0 24px 60px rgba(16,35,59,.12);padding:32px}.brand{text-align:center;margin-bottom:24px}.logo{display:inline-grid;place-items:center;width:86px;height:86px;border-radius:22px;background:linear-gradient(145deg,#0c79df,#113b72);color:white;font-size:32px;font-weight:900;letter-spacing:-3px}.brand h1{margin:14px 0 4px;font-size:30px}.brand p{margin:0;color:#64748b;font-weight:600}.notice{padding:14px 16px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;color:#1e3a8a;margin:18px 0}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:7px;color:#475569}.field input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px}.btn{width:100%;border:0;border-radius:11px;padding:13px 16px;background:#1769c2;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px}.msg.ok{display:block;background:#ecfdf5;color:#065f46}.msg.err{display:block;background:#fef2f2;color:#b91c1c}.small{font-size:13px;color:#64748b;margin-top:18px;text-align:center}.hidden{display:none}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<div class="brand"><div class="logo">NC</div><h1>NexCompra</h1><p>ERP Enterprise • Recuperação segura de acesso</p></div>
<div id="checking" class="notice">Validando o link de recuperação...</div>
<section id="resetBox" class="hidden">
<h2>Definir nova senha</h2>
<p style="color:#64748b">Digite sua nova senha para concluir a recuperação.</p>
<div class="field"><label>Nova senha</label><input id="p1" type="password" minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></div>
<div class="field"><label>Confirmar nova senha</label><input id="p2" type="password" minlength="8" autocomplete="new-password" placeholder="Repita a senha"></div>
<button id="save" class="btn" onclick="savePassword()">Salvar nova senha</button>
</section>
<div id="msg" class="msg"></div>
<div class="small">NexCompra ERP Enterprise v5.0.3</div>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://xfvcryztmmlrfaeozefb.supabase.co';
const SUPABASE_KEY='sb_publishable_xWvcOv8A';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const msg=(t,ok=false)=>{const e=document.getElementById('msg');e.textContent=t;e.className='msg '+(ok?'ok':'err')};
async function init(){
 const c=document.getElementById('checking'), box=document.getElementById('resetBox');
 try{
  const {data:{session}}=await sb.auth.getSession();
  if(session){c.classList.add('hidden');box.classList.remove('hidden');return}
  sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session){c.classList.add('hidden');box.classList.remove('hidden')}});
  setTimeout(()=>{if(!c.classList.contains('hidden')){c.textContent='O link ainda não foi validado. Abra novamente o link recebido por e-mail. Se ele expirou, solicite uma nova recuperação no NexCompra.'}},2200);
 }catch(e){c.classList.add('hidden');msg('Não foi possível validar o link: '+(e.message||e))}
}
async function savePassword(){
 const a=document.getElementById('p1').value,b=document.getElementById('p2').value,btn=document.getElementById('save');
 if(a.length<8)return msg('A senha deve ter pelo menos 8 caracteres.');if(a!==b)return msg('As senhas não coincidem.');
 btn.disabled=true;btn.textContent='Salvando...';
 try{const {error}=await sb.auth.updateUser({password:a});if(error)throw error;msg('Senha alterada com sucesso. Volte ao NexCompra e entre com a nova senha.',true);await sb.auth.signOut()}catch(e){msg('Falha ao alterar senha: '+(e.message||e))}finally{btn.disabled=false;btn.textContent='Salvar nova senha'}
}
init();
</script>
</body></html>
