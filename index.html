<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexCompra ERP Enterprise</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f3f7fb;color:#10233b}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);background:#fff;border:1px solid #dbe5ef;border-radius:22px;box-shadow:0 24px 60px rgba(16,35,59,.12);padding:32px}.brand{text-align:center;margin-bottom:24px}.logo{display:inline-grid;place-items:center;width:86px;height:86px;border-radius:22px;background:linear-gradient(145deg,#0c79df,#113b72);color:white;font-size:32px;font-weight:900;letter-spacing:-3px}.brand h1{margin:14px 0 4px;font-size:30px}.brand p{margin:0;color:#64748b;font-weight:600}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:7px;color:#475569}.field input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px}.btn{width:100%;border:0;border-radius:11px;padding:13px 16px;background:#1769c2;color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px}.btn.alt{background:#e8eef5;color:#17324d}.link{border:0;background:transparent;color:#1769c2;font-weight:700;cursor:pointer;padding:10px 0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.tabs button{padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc;font-weight:800;cursor:pointer}.tabs button.active{background:#1769c2;color:#fff;border-color:#1769c2}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px}.msg.ok{display:block;background:#ecfdf5;color:#065f46}.msg.err{display:block;background:#fef2f2;color:#b91c1c}.hidden{display:none}.small{font-size:13px;color:#64748b;margin-top:18px;text-align:center}</style></head><body><div class="wrap"><main class="card"><div class="brand"><div class="logo">NC</div><h1>NexCompra</h1><p>ERP Enterprise • Ambiente exclusivo</p></div><div id="authBox"><div class="tabs"><button id="tabLogin" class="active" onclick="showTab('login')">Entrar</button><button id="tabCreate" onclick="showTab('create')">Criar acesso</button></div><section id="loginBox"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn" onclick="login()">Entrar na plataforma</button><button class="link" onclick="recover()">Esqueci minha senha</button></section><section id="createBox" class="hidden"><div class="field"><label>E-mail</label><input id="newEmail" type="email"></div><div class="field"><label>Senha</label><input id="newPassword" type="password" minlength="8"></div><div class="field"><label>Empresa</label><input id="companyName" placeholder="Ex.: Balneário do Lago Hotel Ltda"></div><button class="btn" onclick="signup()">Criar acesso e empresa</button></section></div><section id="resetBox" class="hidden"><h2>Definir nova senha</h2><div class="field"><label>Nova senha</label><input id="p1" type="password" minlength="8"></div><div class="field"><label>Confirmar nova senha</label><input id="p2" type="password" minlength="8"></div><button class="btn" onclick="savePassword()">Salvar nova senha</button></section><div id="msg" class="msg"></div><div class="small">NexCompra ERP Enterprise v5.0.6</div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://ulgocbftudqnntpupwkl.supabase.co';
const SUPABASE_KEY='sb_publishable_Z4z1U8uqRzHyY1Cv9G3X4Q_5zaw_un-';
const BASE_URL='https://diegojuniothevis-dev.github.io/nexcompra/';
const ERP_URL=BASE_URL+'erp.html';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const recoveryMode=location.hash.includes('type=recovery')||location.search.includes('type=recovery');
const msg=(t,ok=false)=>{const e=document.getElementById('msg');e.textContent=t;e.className='msg '+(ok?'ok':'err')};
function showTab(x){document.getElementById('loginBox').classList.toggle('hidden',x!=='login');document.getElementById('createBox').classList.toggle('hidden',x!=='create');document.getElementById('tabLogin').classList.toggle('active',x==='login');document.getElementById('tabCreate').classList.toggle('active',x==='create')}
function openERP(){location.replace(ERP_URL)}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;try{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;openERP()}catch(e){msg('Não foi possível entrar: '+(e.message||e))}}
async function recover(){const email=document.getElementById('email').value.trim();if(!email)return msg('Informe seu e-mail primeiro.');try{const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:BASE_URL});if(error)throw error;msg('Link de recuperação enviado. Verifique seu e-mail.',true)}catch(e){msg('Falha ao enviar recuperação: '+(e.message||e))}}
async function signup(){const email=document.getElementById('newEmail').value.trim(),password=document.getElementById('newPassword').value,name=document.getElementById('companyName').value.trim();if(password.length<8||!name)return msg('Informe empresa e uma senha com pelo menos 8 caracteres.');try{const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:email.split('@')[0]}}});if(error)throw error;if(!data.session) return msg('Cadastro criado, mas não foi possível iniciar a sessão automaticamente. Tente entrar com o e-mail e a senha.',false);const {error:e2}=await sb.rpc('nx_bootstrap_company',{p_name:name,p_trade_name:name,p_cnpj:null});if(e2 && !String(e2.message||'').includes('already belongs')) throw e2;openERP()}catch(e){msg('Falha ao criar acesso: '+(e.message||e))}}
async function savePassword(){const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length<8)return msg('A senha deve ter pelo menos 8 caracteres.');if(a!==b)return msg('As senhas não coincidem.');try{const {error}=await sb.auth.updateUser({password:a});if(error)throw error;msg('Senha alterada com sucesso. Abrindo o NexCompra...',true);setTimeout(openERP,700)}catch(e){msg('Falha ao alterar senha: '+(e.message||e))}}
function showRecovery(){document.getElementById('authBox').classList.add('hidden');document.getElementById('resetBox').classList.remove('hidden')}
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){showRecovery()}else if(event==='SIGNED_IN'&&session&&!recoveryMode){openERP()}});
(async()=>{const {data:{session}}=await sb.auth.getSession();if(recoveryMode){showRecovery();return}if(session)openERP()})();
</script></body></html>
