<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NexCompra APK</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}#app{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="app-cotacao-v2.html?v=541" title="NexCompra"></iframe><script>(()=>{const app=document.getElementById('app');const printCss=`@page{size:A4 portrait;margin:5mm!important}html,body{margin:0!important;padding:0!important;width:100%!important;min-height:0!important;background:#fff!important}.pageBreak,[class*=pageBreak]{display:none!important;page-break-before:auto!important;break-before:auto!important;page-break-after:auto!important;break-after:auto!important}.printOnly{display:block!important}header,.noPrint,.actionSidebar,.sidebarBackdrop,.mobileMenuButton{display:none!important}.report,.reportPage,.printPage,.page,.sheet,.container,.wrap,main{max-width:none!important;width:100%!important;margin:0!important;padding:0!important;box-shadow:none!important}.card{box-shadow:none!important;margin:0 0 3px!important;padding:4px!important;border-radius:4px!important}.kpis,.dashboardGrid,.approvalGrid{gap:3px!important}.kpi,.metric,.approvalCard{padding:4px!important}.kpi span,.metric strong{font-size:11px!important}.kpi b,.metric b,label,.small,.muted{font-size:6.5px!important}h1{font-size:13px!important}h2{font-size:11px!important;margin:3px 0!important}h3{font-size:9px!important;margin:2px 0!important}table{font-size:6.4px!important;min-width:0!important;width:100%!important}th,td{padding:2px 3px!important;line-height:1.15!important}.tableWrap{overflow:visible!important;border:0!important}.ocHeader{margin-bottom:4px!important;padding-bottom:4px!important}.ocInfoGrid,.ocAfterTable,.ocApprovals{gap:3px!important;margin:3px 0!important}.infoBox,.ocNotes{padding:4px!important}.ocSignatures{margin-top:10px!important;gap:8px!important}.ocFooter{margin-top:4px!important;padding-top:3px!important}body{zoom:.72!important}`;
function hookQuote(q){try{const w=q.contentWindow;if(!w||w.__nxPrintHook)return;w.__nxPrintHook=true;const nativeOpen=w.open.bind(w);w.open=function(){const child=nativeOpen.apply(w,arguments);try{if(child&&child.document&&!child.__nxA4Hook){child.__nxA4Hook=true;const inject=()=>{try{if(!child.document||!child.document.head)return;let s=child.document.getElementById('nx-a4-one-page');if(!s){s=child.document.createElement('style');s.id='nx-a4-one-page';s.textContent=printCss;child.document.head.appendChild(s)}}catch(e){}};const close=child.document.close.bind(child.document);child.document.close=function(){inject();return close()};setTimeout(inject,60);setTimeout(inject,300)}}catch(e){}return child};}catch(e){}}
function scan(){try{const d1=app.contentDocument;if(!d1)return;const f1=d1.getElementById('nxroot');if(!f1)return;const d2=f1.contentDocument;if(!d2)return;const q=d2.getElementById('nxQuoteFrame');if(!q)return;hookQuote(q);if(!q.dataset.nxPrintListener){q.dataset.nxPrintListener='1';q.addEventListener('load',()=>setTimeout(()=>hookQuote(q),80))}}catch(e){}}
app.addEventListener('load',()=>{setTimeout(scan,500);setTimeout(scan,1800);setTimeout(scan,4000)});setInterval(scan,1200)})();</script></body></html>
